      <text x="22" y="34" font-size="10" letter-spacing="1.6" fill="#82948e">02 / GOOGLE</text>
      <text x="342" y="34" text-anchor="end" font-weight="700" font-size="12" fill="#68c9ee">SEARCH</text>
      <text x="22" y="78" font-weight="700" font-size="24" fill="#f1f5f2">Rozumiem temat, strukturę</text>
