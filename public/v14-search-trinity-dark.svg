<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Człowiek, Google i system AI w architekturze LeadFlowAI</title>
  <desc id="d">Trzy ciemne panele pokazujące interfejs użytkownika, widoczność w wyszukiwarce oraz graf encji systemu AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071216"/>
      <stop offset="1" stop-color="#031015"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122125" stop-opacity=".92"/>
      <stop offset="1" stop-color="#071115" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#58a8b4" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="28" fill="url(#grid)"/>
