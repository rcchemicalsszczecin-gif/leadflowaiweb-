      <text x="22" y="34" font-size="10" letter-spacing="1.6" fill="#82948e">03 / SYSTEM AI</text>
      <text x="342" y="34" text-anchor="end" font-weight="700" font-size="12" fill="#b8ff38">ENTITY</text>
      <text x="22" y="78" font-weight="700" font-size="24" fill="#f1f5f2">Mogę odczytać fakty,</text>
      <text x="22" y="106" font-weight="700" font-size="24" fill="#f1f5f2">encje i źródła.</text>
      <text x="22" y="136" font-size="12" fill="#85958f">Marka · organizacja · usługi · wiedza · dowody</text>
