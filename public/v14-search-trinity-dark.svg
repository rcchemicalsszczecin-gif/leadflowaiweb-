<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Jedna treść odczytywana przez człowieka, wyszukiwarkę i system AI</title>
  <desc id="description">Centralne źródło uporządkowanej treści łączy czytelny interfejs, semantykę wyszukiwarki oraz fakty i encje dla systemu AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d22"/>
      <stop offset="1" stop-color="#030510"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172755"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6688ff"/>
      <stop offset=".52" stop-color="#65e3ff"/>
      <stop offset="1" stop-color="#a77aff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#background)"/>
  <path d="M600 88C512 88 487 176 406 190M600 88C688 88 713 176 794 190M600 364C512 364 484 314 406 302M600 364C688 364 716 314 794 302" fill="none" stroke="url(#energy)" stroke-width="2" stroke-opacity=".48"/>
  <path d="M406 190C330 190 320 139 252 139M794 190C870 190 880 139 948 139M406 302C330 302 320 359 252 359M794 302C870 302 880 359 948 359" fill="none" stroke="#65e3ff" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity=".32"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(448 72)">
      <rect width="304" height="356" rx="28" fill="url(#source)" stroke="#65e3ff" stroke-opacity=".52"/>
      <rect x="22" y="22" width="260" height="4" rx="2" fill="url(#energy)"/>
      <text x="28" y="62" fill="#65e3ff" font-size="14" font-weight="700" letter-spacing="1.5">JEDNO ŹRÓDŁO TREŚCI</text>
      <text x="28" y="106" fill="#f7f9ff" font-size="27" font-weight="700">Usługa opisana jasno</text>
      <text x="28" y="137" fill="#f7f9ff" font-size="27" font-weight="700">i zgodnie z faktami.</text>
      <text x="28" y="178" fill="#aebbd2" font-size="15">Znaczenie, struktura i dowody</text>
      <text x="28" y="201" fill="#aebbd2" font-size="15">pozostają spójne w każdym odczycie.</text>
      <g transform="translate(28 238)" font-size="14" font-weight="700">
        <rect width="72" height="34" rx="17" fill="#65e3ff" fill-opacity=".1" stroke="#65e3ff" stroke-opacity=".4"/><text x="36" y="22" text-anchor="middle" fill="#65e3ff">USŁUGA</text>
        <rect x="82" width="58" height="34" rx="17" fill="#6688ff" fill-opacity=".12" stroke="#6688ff" stroke-opacity=".42"/><text x="111" y="22" text-anchor="middle" fill="#aabaff">FAQ</text>
        <rect x="150" width="72" height="34" rx="17" fill="#a77aff" fill-opacity=".12" stroke="#a77aff" stroke-opacity=".42"/><text x="186" y="22" text-anchor="middle" fill="#c8aaff">SCHEMA</text>
      </g>
      <text x="28" y="320" fill="#8d9bb4" font-size="14">KANONICZNY URL · LINKI · ENCJE</text>
    </g>

    <g transform="translate(54 80)">
      <circle cx="145" cy="72" r="68" fill="#65e3ff" fill-opacity=".06" stroke="#65e3ff" stroke-opacity=".44"/>
      <path d="M115 78l22 22 43-52" fill="none" stroke="#65e3ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="145" y="174" text-anchor="middle" fill="#f7f9ff" font-size="22" font-weight="700">CZŁOWIEK</text>
      <text x="145" y="202" text-anchor="middle" fill="#aebbd2" font-size="15">widzi ofertę i kolejny krok</text>
      <text x="145" y="230" text-anchor="middle" fill="#65e3ff" font-size="14" font-weight="700">UX · TREŚĆ · KONTAKT</text>
    </g>

    <g transform="translate(856 80)">
      <circle cx="145" cy="72" r="68" fill="#6688ff" fill-opacity=".07" stroke="#6688ff" stroke-opacity=".5"/>
      <circle cx="135" cy="64" r="25" fill="none" stroke="#92a8ff" stroke-width="5"/>
      <path d="M154 83l22 22" stroke="#92a8ff" stroke-width="5" stroke-linecap="round"/>
      <text x="145" y="174" text-anchor="middle" fill="#f7f9ff" font-size="22" font-weight="700">WYSZUKIWARKA</text>
      <text x="145" y="202" text-anchor="middle" fill="#aebbd2" font-size="15">rozumie temat i relacje</text>
      <text x="145" y="230" text-anchor="middle" fill="#92a8ff" font-size="14" font-weight="700">SEO · SEMANTYKA · LINKI</text>
    </g>

    <g transform="translate(455 374)">
      <circle cx="145" cy="0" r="54" fill="#a77aff" fill-opacity=".08" stroke="#a77aff" stroke-opacity=".54"/>
      <circle cx="125" cy="-8" r="7" fill="#c8aaff"/><circle cx="165" cy="-8" r="7" fill="#c8aaff"/><circle cx="145" cy="20" r="7" fill="#65e3ff"/>
      <path d="M125-8l20 28 20-28M125-8h40" fill="none" stroke="#c8aaff" stroke-width="2"/>
      <text x="145" y="80" text-anchor="middle" fill="#f7f9ff" font-size="22" font-weight="700">SYSTEM AI</text>
      <text x="145" y="106" text-anchor="middle" fill="#aebbd2" font-size="15">odczytuje fakty, źródła i encje</text>
    </g>
  </g>
  <circle cx="600" cy="72" r="5" fill="#65e3ff" filter="url(#glow)"/>
</svg>
