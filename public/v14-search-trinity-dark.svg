      <text x="22" y="136" font-size="12" fill="#85958f">Hierarchia · produkt · dowody · CTA</text>
      <rect x="22" y="170" width="334" height="264" rx="18" fill="#071013" stroke="#6f938a" stroke-opacity=".18"/>
      <circle cx="44" cy="194" r="4" fill="#b8ff38"/>
      <rect x="58" y="191" width="44" height="6" rx="3" fill="#40514c"/>
      <rect x="286" y="184" width="52" height="20" rx="10" fill="#b8ff38"/>
      <rect x="44" y="231" width="166" height="18" rx="5" fill="#dce7e1"/>
      <rect x="44" y="267" width="140" height="8" rx="4" fill="#5c716a"/>
      <rect x="44" y="284" width="108" height="8" rx="4" fill="#3b4d48"/>
      <rect x="44" y="320" width="78" height="28" rx="14" fill="#b8ff38"/>
      <rect x="230" y="224" width="100" height="146" rx="14" fill="#b8ff38" fill-opacity=".045" stroke="#b8ff38" stroke-opacity=".24"/>
