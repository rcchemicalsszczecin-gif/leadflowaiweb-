      <text x="22" y="136" font-size="12" fill="#85958f">Semantyka · canonical · schema · linki</text>
      <rect x="22" y="170" width="334" height="264" rx="18" fill="#081317" stroke="#70968e" stroke-opacity=".20"/>
      <circle cx="48" cy="204" r="11" fill="none" stroke="#68c9ee" stroke-width="3"/>
      <text x="68" y="208" font-size="10" font-weight="700" fill="#cbd8d3">leadflowai.pl › strony-internetowe</text>
