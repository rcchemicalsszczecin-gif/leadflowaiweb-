<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title description">
  <title id="title">Weryfikacja projektu przed publikacją</title>
  <desc id="description">Jedna ścieżka sprawdza dostępność, wydajność, widoczność i bezpieczeństwo, zanim projekt zostanie oznaczony jako gotowy do publikacji.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1532"/><stop offset="1" stop-color="#040714"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6688ff"/><stop offset=".5" stop-color="#65e3ff"/><stop offset="1" stop-color="#a77aff"/></linearGradient>
    <radialGradient id="ready"><stop stop-color="#65e3ff" stop-opacity=".2"/><stop offset="1" stop-color="#65e3ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="560" rx="30" fill="url(#background)"/>
  <g font-family="Arial, sans-serif">
    <text x="42" y="58" fill="#65e3ff" font-size="14" font-weight="700" letter-spacing="1.5">WERYFIKACJA PRZED PUBLIKACJĄ</text>
    <text x="42" y="98" fill="#f7f9ff" font-size="28" font-weight="700">Cztery obszary. Jeden sprawdzony projekt.</text>
    <text x="42" y="126" fill="#aebbd2" font-size="15">Każdy punkt kończy się konkretnym wynikiem kontroli.</text>

    <path d="M92 214C192 158 278 170 345 240S496 345 628 270" fill="none" stroke="#20305f" stroke-width="22" stroke-linecap="round"/>
    <path d="M92 214C192 158 278 170 345 240S496 345 628 270" fill="none" stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(92 214)">
      <circle r="38" fill="#0d1d3d" stroke="#65e3ff" stroke-width="2"/>
      <path d="M-14 1l10 10 21-25" fill="none" stroke="#65e3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="64" text-anchor="middle" fill="#f7f9ff" font-size="16" font-weight="700">DOSTĘPNOŚĆ</text>
      <text x="0" y="87" text-anchor="middle" fill="#9dabc3" font-size="14">obsługa i czytelność</text>
    </g>
    <g transform="translate(267 192)">
      <circle r="38" fill="#101c42" stroke="#7d9aff" stroke-width="2"/>
      <path d="M-18 13a24 24 0 1 1 36 0M0-22v18l14 8" fill="none" stroke="#9bafff" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="76" text-anchor="middle" fill="#f7f9ff" font-size="16" font-weight="700">WYDAJNOŚĆ</text>
      <text x="0" y="99" text-anchor="middle" fill="#9dabc3" font-size="14">budżet i stabilność</text>
    </g>
    <g transform="translate(435 304)">
      <circle r="38" fill="#111a3a" stroke="#a77aff" stroke-width="2"/>
      <circle cx="-5" cy="-5" r="13" fill="none" stroke="#c2a4ff" stroke-width="4"/><path d="M5 5l14 14" stroke="#c2a4ff" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="76" text-anchor="middle" fill="#f7f9ff" font-size="16" font-weight="700">WIDOCZNOŚĆ</text>
      <text x="0" y="99" text-anchor="middle" fill="#9dabc3" font-size="14">treść i indeksowanie</text>
    </g>
    <g transform="translate(628 270)">
      <circle r="38" fill="#0d1d3d" stroke="#65e3ff" stroke-width="2"/>
      <path d="M0-21l19 8v15c0 13-8 22-19 28C-11 24-19 15-19 2v-15z" fill="none" stroke="#65e3ff" stroke-width="4" stroke-linejoin="round"/>
      <text x="0" y="76" text-anchor="middle" fill="#f7f9ff" font-size="16" font-weight="700">BEZPIECZEŃSTWO</text>
      <text x="0" y="99" text-anchor="middle" fill="#9dabc3" font-size="14">granice i konfiguracja</text>
    </g>

    <g transform="translate(183 428)">
      <rect width="354" height="88" rx="22" fill="#0d1837" stroke="#65e3ff" stroke-opacity=".5"/>
      <circle cx="49" cy="44" r="46" fill="url(#ready)"/><path d="M33 44l11 11 23-28" fill="none" stroke="#65e3ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="38" fill="#65e3ff" font-size="14" font-weight="700" letter-spacing="1.2">WYNIK KONTROLI</text>
      <text x="92" y="66" fill="#f7f9ff" font-size="21" font-weight="700">Gotowe do decyzji o publikacji</text>
    </g>
  </g>
</svg>
