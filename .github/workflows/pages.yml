name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and build static site
        run: npm run verify
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Verify Pages artifact identity
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(tr -d '\r\n' < out/CNAME)" = "leadflowai.pl"
          test -f out/.nojekyll
          test ! -e out/api
          echo "PAGES_ARTIFACT_PASS"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
