name: V14 Lock Refresh

on:
  push:
    branches:
      - v14/full-visual-rebuild
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: v14-lock-refresh
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify declared Next version
        run: node -e "const p=require('./package-lock.json'); if(p.packages[''].dependencies.next!=='16.3.1') process.exit(1)"

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v14-package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 2
