name: V14 Lock Refresh

on:
  push:
    branches:
      - v14/full-visual-rebuild
    paths:
      - package.json
      - .github/workflows/v14-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: v14-lock-refresh
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v14/full-visual-rebuild

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify declared Next version
        run: node -e "const p=require('./package-lock.json'); if(p.packages[''].dependencies.next!=='16.3.1') process.exit(1)"

      - name: Commit lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "LeadFlowAI Lock Refresh"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "V14.9: refresh lockfile for Next 16.3.1"
          git push origin HEAD:v14/full-visual-rebuild

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v14-package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 2
