name: V14 Visual Preview

on:
  push:
    branches:
      - v14/full-visual-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static V14
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Start static preview
        shell: bash
        run: |
          python3 -m http.server 3000 -d out >/tmp/v14-preview.log 2>&1 &
          echo $! > /tmp/v14-preview.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/v14-preview.log
          exit 1

      - name: Capture desktop and mobile
        shell: bash
        run: |
          mkdir -p preview
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          COMMON="--headless=new --no-sandbox --hide-scrollbars --use-gl=swiftshader --enable-webgl --ignore-gpu-blocklist --run-all-compositor-stages-before-draw --virtual-time-budget=5000"
          $BROWSER $COMMON --window-size=1440,1200 --screenshot=preview/v14-desktop-1440.png http://127.0.0.1:3000/
          $BROWSER $COMMON --window-size=390,844 --screenshot=preview/v14-mobile-390.png http://127.0.0.1:3000/
          $BROWSER $COMMON --window-size=1440,7600 --screenshot=preview/v14-desktop-long.png http://127.0.0.1:3000/
          ls -lh preview

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: v14-visual-preview-${{ github.sha }}
          path: preview/*.png
          retention-days: 7
