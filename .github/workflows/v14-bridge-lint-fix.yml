name: V14 Bridge CSS Lint Fix

on:
  push:
    branches:
      - v14/full-visual-rebuild
    paths:
      - .github/workflows/v14-bridge-lint-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact V14 branch
        uses: actions/checkout@v6
        with:
          ref: v14/full-visual-rebuild

      - name: Apply bounded selector cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/precision-water.css')
          text = path.read_text()

          old = '''  .quality-item p,
  .section-dark .stage-detail > p,
  .knowledge-truth > .page-shell > p:last-child,
  .knowledge-hero-copy > p:last-child,
  .portfolio-hero-copy > p:last-child,
  .knowledge-article-head > p:last-child,
  .contact-hero-copy,
  .service-lead,'''
          new = '''  .quality-item p,
  .section-dark .stage-detail > p,
  .knowledge-hero-copy > p:last-child,
  .portfolio-hero-copy > p:last-child,
  .knowledge-article-head > p:last-child,
  .contact-hero-copy,
  .service-lead,
  .knowledge-truth > .page-shell > p:last-child,'''
          if text.count(old) != 1:
              raise SystemExit('expected one typography selector block')
          text = text.replace(old, new, 1)

          replacements = [
              ('  .form-section-head > span,', '  .contact-form-section .form-section-head > span,'),
              ('  .contact-direct > span,', '  .contact-section .contact-direct > span,'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify only intended file changed
        shell: bash
        run: test "$(git diff --name-only)" = "app/precision-water.css"

      - name: Commit bridge CSS lint cleanup
        shell: bash
        run: |
          git config user.name "LeadFlowAI V14 QA"
          git config user.email "actions@users.noreply.github.com"
          git add app/precision-water.css
          git commit -m "V14.9: remove remaining bridge CSS specificity warnings"
          git push origin HEAD:v14/full-visual-rebuild
