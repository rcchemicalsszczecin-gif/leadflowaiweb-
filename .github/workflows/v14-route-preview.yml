name: V14 Route Visual Preview

on:
  push:
    branches:
      - 'v14/**'
  workflow_dispatch:

concurrency:
  group: v14-route-preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static V14
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Start static preview
        shell: bash
        run: |
          python3 -m http.server 3000 -d out >/tmp/v14-route-preview.log 2>&1 &
          echo $! > /tmp/v14-route-preview.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/v14-route-preview.log
          exit 1

      - name: Capture representative public routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p route-preview
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"

          capture() {
            name="$1"
            path="$2"
            width="$3"
            height="$4"
            profile="/tmp/v14-route-${name}"
            rm -rf "$profile"
            timeout --signal=TERM --kill-after=5s 35s "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --disable-component-update \
              --no-first-run \
              --no-default-browser-check \
              --hide-scrollbars \
              --use-gl=angle \
              --use-angle=swiftshader-webgl \
              --enable-webgl \
              --ignore-gpu-blocklist \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=3500 \
              --user-data-dir="$profile" \
              --window-size="${width},${height}" \
              --screenshot="route-preview/${name}.png" \
              "http://127.0.0.1:3000${path}"
            test -s "route-preview/${name}.png"
            rm -rf "$profile"
          }

          capture service-desktop /strony-internetowe/ 1440 1600
          capture service-mobile /strony-internetowe/ 390 1200
          capture knowledge-desktop /wiedza/ 1440 1600
          capture knowledge-mobile /wiedza/ 390 1200
          capture contact-desktop /kontakt/ 1440 1400
          capture contact-mobile /kontakt/ 390 1100
          capture lab-desktop /lab/ 1440 1400
          capture lab-mobile /lab/ 390 1100

          ls -lh route-preview

      - name: Upload route visual preview
        uses: actions/upload-artifact@v4
        with:
          name: v14-route-preview-${{ github.sha }}
          path: route-preview/*
          retention-days: 7
          if-no-files-found: error

      - name: Verify route captures
        shell: bash
        run: |
          test -s route-preview/service-desktop.png
          test -s route-preview/service-mobile.png
          test -s route-preview/knowledge-desktop.png
          test -s route-preview/knowledge-mobile.png
          test -s route-preview/contact-desktop.png
          test -s route-preview/contact-mobile.png
          test -s route-preview/lab-desktop.png
          test -s route-preview/lab-mobile.png
          echo "V14_ROUTE_PREVIEW_PASS routes=4 viewports=2 captures=8"
