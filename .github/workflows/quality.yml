name: Quality

on:
  push:
    branches:
      - build/leadflowai
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject retired brand residue
        shell: bash
        run: |
          retired="$(printf '%s%s' 'Ave' 'riq')"
          if grep -RniI -i --exclude-dir=.git -- "$retired" .; then
            echo "Retired brand residue found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Search architecture contracts
        run: npm run search:contract

      - name: Lead system contracts
        run: npm run lead:contract

      - name: Chat system contracts
        run: npm run chat:contract

      - name: Content and portfolio contracts
        run: npm run content:contract

      - name: Typecheck
        run: npm run typecheck

      - name: Biome
        run: npm run check

      - name: Build
        run: npm run build

      - name: Runtime lead smoke
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/leadflowai-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/kontakt >/tmp/contact.html; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-next.log
            echo "LeadFlowAI production server did not become ready"
            exit 1
          fi

          grep -q "Opisz stronę" /tmp/contact.html
          grep -q "kontakt@leadflowai.pl" /tmp/contact.html

          foreign_status="$(curl -sS -o /tmp/foreign.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/leads \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://invalid.example' \
            --data '{}')"
          test "$foreign_status" = "403"

          started_at="$(node -e 'process.stdout.write(String(Date.now()-2000))')"
          payload="$(printf '%s' "{\"name\":\"Test Lead\",\"email\":\"test@example.com\",\"phone\":\"\",\"company\":\"\",\"projectType\":\"strona-firmowa\",\"currentUrl\":\"\",\"goal\":\"Potrzebuję nowej strony firmowej do testu walidacji.\",\"scope\":\"\",\"budget\":\"nie-wiem\",\"deadline\":\"\",\"website\":\"\",\"contactPermission\":true,\"startedAt\":${started_at}}")"
          fallback_status="$(curl -sS -o /tmp/fallback.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/leads \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3000' \
            --data "$payload")"
          test "$fallback_status" = "503"
          grep -q 'DELIVERY_UNCONFIGURED' /tmp/fallback.json
          grep -q 'kontakt@leadflowai.pl' /tmp/fallback.json

          echo "LEAD_RUNTIME_SMOKE_PASS contact=200 foreign-origin=403 unconfigured-delivery=503"

      - name: Runtime chat smoke
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3001 >/tmp/leadflowai-chat.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/tmp/home.html; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-chat.log
            echo "LeadFlowAI chat smoke server did not become ready"
            exit 1
          fi

          grep -q "Zapytaj LeadFlowAI" /tmp/home.html

          foreign_status="$(curl -sS -o /tmp/chat-foreign.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3001/api/chat \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://invalid.example' \
            --data '{"message":"Czy robicie strony?"}')"
          test "$foreign_status" = "403"

          knowledge_status="$(curl -sS -o /tmp/chat-knowledge.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3001/api/chat \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3001' \
            --data '{"message":"Czy robicie sklepy internetowe?"}')"
          test "$knowledge_status" = "200"
          grep -q '"mode":"knowledge"' /tmp/chat-knowledge.json
          grep -qi 'sklep' /tmp/chat-knowledge.json

          fallback_status="$(curl -sS -o /tmp/chat-fallback.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3001/api/chat \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3001' \
            --data '{"message":"Opowiedz o hipotetycznym systemie kwantowym."}')"
          test "$fallback_status" = "200"
          grep -q '"mode":"fallback"' /tmp/chat-fallback.json
          grep -q 'kontakt@leadflowai.pl' /tmp/chat-fallback.json

          echo "CHAT_RUNTIME_SMOKE_PASS ui=200 foreign-origin=403 knowledge=200 fallback=200"

      - name: Runtime content smoke
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3002 >/tmp/leadflowai-content.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/realizacje >/tmp/portfolio.html; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-content.log
            echo "LeadFlowAI content smoke server did not become ready"
            exit 1
          fi

          grep -q "PROJEKT WŁASNY" /tmp/portfolio.html
          grep -q "AKTYWNIE ROZWIJANY" /tmp/portfolio.html

          curl -fsS http://127.0.0.1:3002/wiedza >/tmp/knowledge.html
          grep -q "Wiedza, która pomaga" /tmp/knowledge.html

          curl -fsS http://127.0.0.1:3002/wiedza/jak-zaplanowac-strone-firmowa >/tmp/article.html
          grep -q "Jak zaplanować stronę firmową" /tmp/article.html
          grep -q 'Article' /tmp/article.html

          curl -fsS http://127.0.0.1:3002/sitemap.xml >/tmp/sitemap.xml
          grep -q '/realizacje' /tmp/sitemap.xml
          grep -q '/wiedza/jak-zaplanowac-strone-firmowa' /tmp/sitemap.xml

          echo "CONTENT_RUNTIME_SMOKE_PASS portfolio=200 knowledge=200 article=200 sitemap=PASS"
