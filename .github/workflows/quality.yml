name: Quality

on:
  push:
    branches:
      - build/leadflowai
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject retired brand residue
        shell: bash
        run: |
          retired="$(printf '%s%s' 'Ave' 'riq')"
          if grep -RniI -i --exclude-dir=.git -- "$retired" .; then
            echo "Retired brand residue found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Biome
        run: npm run check

      - name: Build
        run: npm run build
