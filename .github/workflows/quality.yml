name: Quality

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject retired brand residue
        shell: bash
        run: |
          retired="$(printf '%s%s' 'Ave' 'riq')"
          if grep -RniI -i --exclude-dir=.git -- "$retired" .; then
            echo "Retired brand residue found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full repository verification
        run: npm run verify
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Verify tracked generated-state stability
        shell: bash
        run: |
          git diff --exit-code --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "GENERATED_TRACKED_STATE_STABLE"

      - name: Static export artifact contract
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(tr -d '\r\n' < out/CNAME)" = "leadflowai.pl"
          test -f out/.nojekyll
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/v14.css
          test -f out/v14-shell.css
          test ! -e out/api/leads
          test ! -e out/api/chat
          test ! -e out/api/health
          test -f out/kontakt/index.html
          test -f out/lab/index.html
          test -f out/uslugi/index.html
          test -f out/o-nas/index.html

          for route in \
            ux-ui-design \
            aplikacje-webowe \
            cms-headless \
            pwa \
            strony-wielojezyczne \
            copywriting-content \
            cro-optymalizacja-konwersji \
            analityka-webowa \
            formularze-lead-generation \
            integracje-ai \
            integracje-api \
            automatyzacje-www \
            core-web-vitals \
            dostepnosc-wcag \
            bezpieczenstwo-stron \
            hosting-deploy \
            opieka-utrzymanie-stron \
            rag-bazy-wiedzy \
            agenci-ai-www \
            monitoring-www; do
            test -f "out/${route}/index.html"
          done

          test -f out/wiedza/ai-search-google-co-robic-2026/index.html
          test -f out/wiedza/wcag-22-co-sprawdzic-na-stronie/index.html
          test -f out/wiedza/rag-na-stronie-jak-zaprojektowac/index.html
          grep -q 'kontakt@leadflowai.pl' out/kontakt/index.html
          grep -q 'Formularz online jest obecnie wyłączony' out/kontakt/index.html
          grep -q 'LEADFLOWAI / PEŁNA OFERTA' out/uslugi/index.html
          grep -q 'RAG' out/uslugi/index.html
          grep -q 'Monitoring' out/uslugi/index.html
          grep -q 'Źródła i standardy' out/wiedza/ai-search-google-co-robic-2026/index.html
          for marker in \
            'pomagają firmie rosnąć' \
            'Porozmawiajmy o projekcie' \
            'Zobacz prawdziwe realizacje' \
            'Zacznij od potrzeby' \
            'Ten sam cel. Inne decyzje' \
            'INTERAKCJA Z UZASADNIENIEM' \
            'WIDOCZNOŚĆ: SEO · AEO · GEO' \
            'JAK PRACUJEMY' \
            'REALIZACJE WŁASNE I MARKI POWIĄZANE' \
            'WIEDZA PRZED DECYZJĄ' \
            'PYTANIA PRZED STARTEM' \
            'PRZYGOTUJ PIERWSZĄ WIADOMOŚĆ' \
            'Zacznijmy od celu' \
            'kontakt@leadflowai.pl'; do
            grep -Fq -- "$marker" out/index.html
          done

          for marker in \
            'v14-browser' \
            'v14-phone' \
            'v14-signature-stage' \
            'v14-liquid-surface' \
            '/v14.css' \
            '/v14-shell.css' \
            'v14-mobile-nav' \
            'Przejdź do treści' \
            'id="main-content"' \
            'id="process"'; do
            grep -Fq -- "$marker" out/index.html
          done

          test "$(grep -o '<h1[ >]' out/index.html | wc -l)" -eq 1

          for literal in \
            'data-static-export-compatibility' \
            'pracują jak produkt' \
            'REAL-TIME SURFACE · SPATIAL PRODUCT' \
            'Sześć warstw jednego produktu cyfrowego' \
            'Jedna marka. Trzy urządzenia' \
            'LIQUID WEB CONSTRUCTOR' \
            'Z płynnej powierzchni'; do
            if grep -Fq -- "$literal" out/index.html; then
              echo "Retired homepage literal leaked into static artifact: $literal"
              exit 1
            fi
          done
          grep -q 'Tervyxa Systems sp. z o.o.' out/o-nas/index.html
          if grep -Rqs 'api.leadflowai.pl/leads' out; then
            echo "Disabled lead endpoint leaked into static artifact"
            exit 1
          fi
          echo "STATIC_ARTIFACT_PASS html=PASS homepage-v14=PASS signature-liquid=PASS signature-spatial=PASS v14-shell=PASS mobile-nav=PASS process-anchor=PASS services=PASS devices=PASS liquid=PASS full-offer-v13=PASS expanded-services=20 knowledge=20plus sources=PASS accessibility=PASS trust=PASS proof=REAL_ONLY contact-direct-email=PASS lead-api=ABSENT"

      - name: Static route smoke
        shell: bash
        run: |
          python3 -m http.server 3000 -d out >/tmp/leadflowai-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              ready=1
              break
            fi
            sleep 0.3
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-static.log
            exit 1
          fi

          for route in \
            /kontakt/ \
            /strony-internetowe/ \
            /landing-pages/ \
            /sklepy-internetowe/ \
            /web-development/ \
            /modernizacja-stron/ \
            /audyt-strony/ \
            /strony-3d-webgl/ \
            /interaktywne-strony/ \
            /motion-design/ \
            /chatboty-ai/ \
            /lab/ \
            /seo/ \
            /aeo/ \
            /geo-ai-search/ \
            /seo-aeo-geo/ \
            /local-seo/ \
            /uslugi/ \
            /ux-ui-design/ \
            /aplikacje-webowe/ \
            /cms-headless/ \
            /pwa/ \
            /strony-wielojezyczne/ \
            /copywriting-content/ \
            /cro-optymalizacja-konwersji/ \
            /analityka-webowa/ \
            /formularze-lead-generation/ \
            /integracje-ai/ \
            /integracje-api/ \
            /automatyzacje-www/ \
            /core-web-vitals/ \
            /dostepnosc-wcag/ \
            /bezpieczenstwo-stron/ \
            /hosting-deploy/ \
            /opieka-utrzymanie-stron/ \
            /rag-bazy-wiedzy/ \
            /agenci-ai-www/ \
            /monitoring-www/ \
            /realizacje/ \
            /o-nas/ \
            /wiedza/ \
            /wiedza/jak-zaplanowac-strone-firmowa/ \
            /wiedza/ai-search-google-co-robic-2026/ \
            /wiedza/rag-na-stronie-jak-zaprojektowac/; do
            curl -fsS "http://127.0.0.1:3000${route}" >/dev/null
          done

          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'leadflowai.pl'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'analityka-webowa'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'rag-bazy-wiedzy'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'monitoring-www'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'ai-search-google-co-robic-2026'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'o-nas'
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q 'sitemap.xml'
          for marker in \
            'pomagają firmie rosnąć' \
            'Porozmawiajmy o projekcie' \
            'Zobacz prawdziwe realizacje' \
            'PRZYGOTUJ PIERWSZĄ WIADOMOŚĆ' \
            'Zacznijmy od celu' \
            'v14-browser' \
            'v14-phone' \
            'v14-signature-stage' \
            'v14-liquid-surface' \
            '/v14.css' \
            '/v14-shell.css' \
            'v14-mobile-nav' \
            'id="main-content"' \
            'id="process"'; do
            grep -Fq -- "$marker" /tmp/home.html
          done
          echo "STATIC_ROUTE_SMOKE_PASS routes=44 sitemap=PASS homepage-v14=PASS signature-liquid=PASS signature-spatial=PASS v14-shell=PASS mobile-nav=PASS process-anchor=PASS services=PASS devices=PASS liquid=PASS full-offer-v13=PASS expanded-services=20 knowledge=20plus accessibility=PASS trust=PASS robots=PASS"
