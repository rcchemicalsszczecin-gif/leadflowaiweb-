name: Quality

on:
  push:
    branches:
      - build/leadflowai
      - design/precision-water-v2
      - design/circuit-water-v3
      - design/hardware-board-v4
      - performance/realistic-board-v5
      - design/content-frames-v6
      - experience/interactive-v7
      - design/premium-composition-v8
      - design/premium-art-direction-v9
      - design/premium-calibration-v9-2
      - qa/responsive-performance-v10
      - content/full-offer-v11
      - v14/full-visual-rebuild
  pull_request:
    branches:
      - main

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject retired brand residue
        shell: bash
        run: |
          retired="$(printf '%s%s' 'Ave' 'riq')"
          if grep -RniI -i --exclude-dir=.git -- "$retired" .; then
            echo "Retired brand residue found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full repository verification
        run: npm run verify
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Static export artifact contract
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(tr -d '\r\n' < out/CNAME)" = "leadflowai.pl"
          test -f out/.nojekyll
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/v14.css
          test -f out/v14-shell.css
          test ! -e out/api/leads
          test ! -e out/api/chat
          test ! -e out/api/health
          test -f out/kontakt/index.html
          test -f out/lab/index.html
          test -f out/uslugi/index.html
          test -f out/o-nas/index.html

          for route in \
            ux-ui-design \
            aplikacje-webowe \
            cms-headless \
            pwa \
            strony-wielojezyczne \
            copywriting-content \
            cro-optymalizacja-konwersji \
            analityka-webowa \
            formularze-lead-generation \
            integracje-ai \
            integracje-api \
            automatyzacje-www \
            core-web-vitals \
            dostepnosc-wcag \
            bezpieczenstwo-stron \
            hosting-deploy \
            opieka-utrzymanie-stron \
            rag-bazy-wiedzy \
            agenci-ai-www \
            monitoring-www; do
            test -f "out/${route}/index.html"
          done

          test -f out/wiedza/ai-search-google-co-robic-2026/index.html
          test -f out/wiedza/wcag-22-co-sprawdzic-na-stronie/index.html
          test -f out/wiedza/rag-na-stronie-jak-zaprojektowac/index.html
          grep -q 'kontakt@leadflowai.pl' out/kontakt/index.html
          grep -q 'Formularz online jest obecnie wyłączony' out/kontakt/index.html
          grep -q 'LEADFLOWAI / PEŁNA OFERTA' out/uslugi/index.html
          grep -q 'RAG' out/uslugi/index.html
          grep -q 'Monitoring' out/uslugi/index.html
          grep -q 'Źródła i standardy' out/wiedza/ai-search-google-co-robic-2026/index.html
          grep -q 'pracują jak produkt' out/index.html
          grep -q 'v14-browser' out/index.html
          grep -q 'v14-phone' out/index.html
          grep -q 'Sześć warstw jednego produktu cyfrowego' out/index.html
          grep -q 'Jedna marka. Trzy urządzenia' out/index.html
          grep -q 'LIQUID WEB CONSTRUCTOR' out/index.html
          grep -q 'Z płynnej powierzchni' out/index.html
          grep -q '/v14.css' out/index.html
          grep -q '/v14-shell.css' out/index.html
          grep -q 'v14-mobile-nav' out/index.html
          grep -q 'Przejdź do treści' out/index.html
          grep -q 'id="main-content"' out/index.html
          grep -q 'id="process"' out/index.html
          grep -q 'Tervyxa Systems sp. z o.o.' out/o-nas/index.html
          if grep -Rqs 'api.leadflowai.pl/leads' out; then
            echo "Disabled lead endpoint leaked into static artifact"
            exit 1
          fi
          echo "STATIC_ARTIFACT_PASS html=PASS homepage-v14=PASS v14-shell=PASS mobile-nav=PASS process-anchor=PASS services=PASS devices=PASS liquid=PASS full-offer-v13=PASS expanded-services=20 knowledge=20plus sources=PASS accessibility=PASS trust=PASS proof=REAL_ONLY contact-direct-email=PASS lead-api=ABSENT"

      - name: Static route smoke
        shell: bash
        run: |
          python3 -m http.server 3000 -d out >/tmp/leadflowai-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              ready=1
              break
            fi
            sleep 0.3
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-static.log
            exit 1
          fi

          for route in \
            /kontakt/ \
            /strony-internetowe/ \
            /landing-pages/ \
            /sklepy-internetowe/ \
            /web-development/ \
            /modernizacja-stron/ \
            /audyt-strony/ \
            /strony-3d-webgl/ \
            /interaktywne-strony/ \
            /motion-design/ \
            /chatboty-ai/ \
            /lab/ \
            /seo/ \
            /aeo/ \
            /geo-ai-search/ \
            /seo-aeo-geo/ \
            /local-seo/ \
            /uslugi/ \
            /ux-ui-design/ \
            /aplikacje-webowe/ \
            /cms-headless/ \
            /pwa/ \
            /strony-wielojezyczne/ \
            /copywriting-content/ \
            /cro-optymalizacja-konwersji/ \
            /analityka-webowa/ \
            /formularze-lead-generation/ \
            /integracje-ai/ \
            /integracje-api/ \
            /automatyzacje-www/ \
            /core-web-vitals/ \
            /dostepnosc-wcag/ \
            /bezpieczenstwo-stron/ \
            /hosting-deploy/ \
            /opieka-utrzymanie-stron/ \
            /rag-bazy-wiedzy/ \
            /agenci-ai-www/ \
            /monitoring-www/ \
            /realizacje/ \
            /o-nas/ \
            /wiedza/ \
            /wiedza/jak-zaplanowac-strone-firmowa/ \
            /wiedza/ai-search-google-co-robic-2026/ \
            /wiedza/rag-na-stronie-jak-zaprojektowac/; do
            curl -fsS "http://127.0.0.1:3000${route}" >/dev/null
          done

          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'leadflowai.pl'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'analityka-webowa'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'rag-bazy-wiedzy'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'monitoring-www'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'ai-search-google-co-robic-2026'
          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'o-nas'
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q 'sitemap.xml'
          grep -q 'pracują jak produkt' /tmp/home.html
          grep -q 'v14-browser' /tmp/home.html
          grep -q 'v14-phone' /tmp/home.html
          grep -q 'Sześć warstw jednego produktu cyfrowego' /tmp/home.html
          grep -q 'Jedna marka. Trzy urządzenia' /tmp/home.html
          grep -q 'LIQUID WEB CONSTRUCTOR' /tmp/home.html
          grep -q '/v14.css' /tmp/home.html
          grep -q '/v14-shell.css' /tmp/home.html
          grep -q 'v14-mobile-nav' /tmp/home.html
          grep -q 'id="main-content"' /tmp/home.html
          grep -q 'id="process"' /tmp/home.html
          echo "STATIC_ROUTE_SMOKE_PASS routes=44 sitemap=PASS homepage-v14=PASS v14-shell=PASS mobile-nav=PASS process-anchor=PASS services=PASS devices=PASS liquid=PASS full-offer-v13=PASS expanded-services=20 knowledge=20plus accessibility=PASS trust=PASS robots=PASS"
