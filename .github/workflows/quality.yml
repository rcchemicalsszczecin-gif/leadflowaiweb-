name: Quality

on:
  push:
    branches:
      - build/leadflowai
      - design/precision-water-v2
      - design/circuit-water-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject retired brand residue
        shell: bash
        run: |
          retired="$(printf '%s%s' 'Ave' 'riq')"
          if grep -RniI -i --exclude-dir=.git -- "$retired" .; then
            echo "Retired brand residue found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full repository verification
        run: npm run verify
        env:
          NEXT_PUBLIC_SITE_URL: https://leadflowai.pl
          NEXT_PUBLIC_API_BASE_URL: https://api.leadflowai.pl

      - name: Static export artifact contract
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(tr -d '\r\n' < out/CNAME)" = "leadflowai.pl"
          test -f out/.nojekyll
          test -f out/sitemap.xml
          test -f out/robots.txt
          test ! -e out/api/leads
          test ! -e out/api/chat
          test ! -e out/api/health
          test -f out/kontakt/index.html
          grep -q 'kontakt@leadflowai.pl' out/kontakt/index.html
          grep -q 'Formularz online jest obecnie wyłączony' out/kontakt/index.html
          if grep -Rqs 'api.leadflowai.pl/leads' out; then
            echo "Disabled lead endpoint leaked into static artifact"
            exit 1
          fi
          echo "STATIC_ARTIFACT_PASS html=PASS cname=PASS nojekyll=PASS contact-direct-email=PASS lead-api=ABSENT"

      - name: Static route smoke
        shell: bash
        run: |
          python3 -m http.server 3000 -d out >/tmp/leadflowai-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              ready=1
              break
            fi
            sleep 0.3
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/leadflowai-static.log
            exit 1
          fi

          for route in \
            /kontakt/ \
            /strony-internetowe/ \
            /landing-pages/ \
            /sklepy-internetowe/ \
            /web-development/ \
            /modernizacja-stron/ \
            /audyt-strony/ \
            /seo-aeo-geo/ \
            /realizacje/ \
            /wiedza/ \
            /wiedza/jak-zaplanowac-strone-firmowa/; do
            curl -fsS "http://127.0.0.1:3000${route}" >/dev/null
          done

          curl -fsS http://127.0.0.1:3000/sitemap.xml | grep -q 'leadflowai.pl'
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -q 'sitemap.xml'
          grep -q 'kontakt@leadflowai.pl' /tmp/home.html
          echo "STATIC_ROUTE_SMOKE_PASS routes=12 sitemap=PASS robots=PASS"
